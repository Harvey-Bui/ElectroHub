<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="ElectroHub: laptops, gaming PCs, monitors, audio and peripherals from the brands that matter."
    />
    <meta name="theme-color" content="#07090d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <title>ElectroHub · Premium Electronics</title>
    <script>
      // Apply the saved theme before first paint so there is no flash. Dark is the default.
      try {
        var saved = localStorage.getItem('eh-theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
