name: electrohub

services:
  redis:
    image: redis:7.4-alpine
    container_name: electrohub-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Redis is ElectroHub's system of record, so durability is enabled:
    #  - AOF with fsync every second (at most ~1s of writes lost on crash)
    #  - RDB snapshots as an additional backup
    # `$$` defers variable expansion to the container's shell, so the
    # password is only applied when REDIS_PASSWORD is non-empty.
    command:
      - sh
      - -c
      - >-
        exec redis-server
        --appendonly yes
        --appendfsync everysec
        --save 900 1 --save 300 10 --save 60 10000
        $${REDIS_PASSWORD:+--requirepass "$$REDIS_PASSWORD"}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli $${REDIS_PASSWORD:+-a "$$REDIS_PASSWORD"} --no-auth-warning ping | grep -q PONG',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
